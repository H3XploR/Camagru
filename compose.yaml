services:
  mysql:
    image: 
       mysql:9.7.1
    environment:
       MYSQL_DATABASE: bdd_camagru
       MYSQL_USER: yantoine
       MYSQL_PASSWORD: yantoine_password
       MYSQL_ALLOW_EMPTY_PASSWORD: no
       MYSQL_RANDOM_ROOT_PASSWORD: yes
       network_mode: host
    volumes:
       - db-data:/etc/data

volumes:
  db-data:
    name: "db-data"
    driver: local
